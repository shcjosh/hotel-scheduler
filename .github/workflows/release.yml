name: release

on:
  push:
    tags:
      # 僅正式版號 vX.Y.Z 觸發 Release；beta/預覽 tag（如 v1.0.3-beta）不觸發
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
            artifact_glob: "backend/dist/*.zip"
          - os: ubuntu-latest
            tag: linux-x64
            artifact_glob: "backend/dist/*.tar.gz"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build executable (PyInstaller)
        working-directory: backend
        run: python build_spec.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-scheduler-${{ matrix.tag }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: find dist -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true
