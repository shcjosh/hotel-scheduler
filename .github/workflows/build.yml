name: build

on:
  push:
    branches:
      - main
      - "*-beta"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
            artifact_glob: "backend/dist/*.zip"
          - os: ubuntu-latest
            tag: linux-x64
            artifact_glob: "backend/dist/*.tar.gz"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build executable (PyInstaller)
        working-directory: backend
        run: python build_spec.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-scheduler-${{ matrix.tag }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(python -c "import sys; sys.path.insert(0, 'backend'); from app.version import __version__; print(__version__)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/shcjosh/hotel-scheduler" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
