name: build

on:
  push:
    branches:
      - main
      - "*-beta"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
            artifact_glob: "backend/dist/*.zip"
          - os: ubuntu-latest
            tag: linux-x64
            artifact_glob: "backend/dist/*.tar.gz"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build executable (PyInstaller)
        working-directory: backend
        run: python build_spec.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-scheduler-${{ matrix.tag }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
